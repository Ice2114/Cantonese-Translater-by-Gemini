<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時翻譯字幕直播</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        .status { text-align: center; color: #f39c12; font-size: 14px; margin-bottom: 15px; }
        .item { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; line-height: 1.5; }
        .original { color: #aaa; font-size: 0.9em; }
        .english { color: #2ecc71; font-weight: bold; font-size: 1.1em; margin-top: 4px; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="status" class="status">📡 正在連接筆記本訊號...</div>
    <div id="subtitles"></div>

    <script>
        const BROADCAST_ID = "my-company-live-room-channel-2026"; // 必須與 index.html 一致
        const subtitlesEl = document.getElementById('subtitles');
        const statusEl = document.getElementById('status');

        function connectToLaptop() {
            const peer = new Peer();
            
            peer.on('open', () => {
                const conn = peer.connect(BROADCAST_ID);

                conn.on('open', () => {
                    statusEl.style.display = 'none'; // 連線成功後隱藏提示
                });

                // 接收筆記本每秒傳來的最新字幕並渲染
                conn.on('data', (data) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div class="original">[${data.time}] 🗣️ ${data.original}</div>
                        <div class="english">🔤 ${data.english}</div>
                    `;
                    subtitlesEl.appendChild(div);
                    div.scrollIntoView({ behavior: 'smooth' });
                });

                // 訊號中斷時自動重新連線
                conn.on('close', () => {
                    statusEl.style.display = 'block';
                    statusEl.textContent = '⚠️ 講者訊號中斷，正在嘗試重新連線...';
                    setTimeout(connectToLaptop, 3000);
                });
            });
        }

        connectToLaptop();
    </script>
</body>
</html>
