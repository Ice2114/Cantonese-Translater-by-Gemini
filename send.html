<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粵英混合語音即時翻譯器 (防斷線+8秒自動截斷版+Google翻譯引擎)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { text-align: center; color: #2c3e50; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:hover { background-color: #c0392b; }
        #saveBtn { background-color: #3498db; color: white; }
        #saveBtn:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        .status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            height: 20px;
        }
        .recording { color: #e74c3c; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .box-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
        }
        .box h3 { margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .log-item {
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #eee;
        }
        .time { font-size: 0.8em; color: #7f8c8d; margin-right: 8px; }
    </style>
</head>
<body>

    <h1>粵英混合語音即時翻譯紀錄器 <br><small style="font-size: 0.6em; color: #7f8c8d;">(防斷線 + 8秒自動截斷 + Google粵語翻譯引擎)</small></h1>
    
    <div class="controls">
        <button id="startBtn">開始錄音翻譯</button>
        <button id="stopBtn" disabled>停止並生成紀錄</button>
        <button id="saveBtn" disabled>下載文字紀錄 (.txt)</button>
    </div>

    <div id="status" class="status">準備就緒</div>

    <div class="box-container">
        <div class="box">
            <h3>即時辨識與翻譯 (Live Translation)</h3>
            <div id="liveText" style="color: #7f8c8d; font-style: italic;">等待語音輸入...</div>
        </div>

        <div class="box">
            <h3>完整逐字紀錄 (Full Transcript Log)</h3>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusEl = document.getElementById('status');
        const liveTextEl = document.getElementById('liveText');
        const logContentEl = document.getElementById('logContent');

        let recognition;
        let isRecording = false;
        let fullTranscript = [];
        let restartTimer = null;      // 15秒完全無聲防卡死計時器
        let forceSegmentTimer = null; // 8秒強制截斷翻譯計時器 (新增)

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('您的瀏覽器不支援 Web Speech API，請改用 Google Chrome 瀏覽器開啟。');
        } else {
            function initRecognition() {
                if (recognition) {
                    recognition.onend = null; 
                    try { recognition.abort(); } catch(e){}
                }

                recognition = new SpeechRecognition();
                recognition.lang = 'zh-HK'; 
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    statusEl.textContent = '● 正在聆聽與翻譯中...';
                    statusEl.classList.add('recording');
                    resetRestartTimer(); 
                };

                recognition.onerror = (event) => {
                    console.error('語音辨識錯誤：', event.error);
                    if (event.error === 'not-allowed') {
                        alert('請允許存取麥克風權限。');
                        stopRecording();
                    }
                };

                recognition.onend = () => {
                    if (isRecording) {
                        statusEl.textContent = '● 系統重連中...';
                        setTimeout(() => {
                            if (isRecording) {
                                try {
                                    recognition.start();
                                } catch (e) {
                                    initRecognition();
                                    recognition.start();
                                }
                            }
                        }, 250); 
                    } else {
                        statusEl.textContent = '已停止錄音';
                        statusEl.classList.remove('recording');
                    }
                };

                recognition.onresult = async (event) => {
                    resetRestartTimer(); // 有收到聲音就重置防卡死計時器

                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const transcriptText = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            // 如果句子自然結束，清除 8 秒強制截斷計時器
                            clearTimeout(forceSegmentTimer);
                            forceSegmentTimer = null;
                            
                            await processAndAppendText(transcriptText);
                        } else {
                            interimTranscript += transcriptText;
                        }
                    }
                    
                    if (interimTranscript) {
                        liveTextEl.textContent = `[聆聽中]: ${interimTranscript}`;
                        
                        // 當有話正在說，且 8 秒計時器還沒啟動時，啟動它
                        if (!forceSegmentTimer) {
                            forceSegmentTimer = setTimeout(() => {
                                console.warn('連續說話達 8 秒，強制截斷並翻譯...');
                                if (recognition) {
                                    try { 
                                        // 呼叫 stop() 會強制將剛才說的話結算為 Final，進而觸發翻譯並重啟
                                        recognition.stop(); 
                                    } catch(e) {}
                                }
                                forceSegmentTimer = null;
                            }, 8000); // 8000 毫秒 = 8 秒
                        }
                    } else {
                        // 如果沒有暫存文字，確保 8 秒計時器關閉
                        clearTimeout(forceSegmentTimer);
                        forceSegmentTimer = null;
                    }
                };
            }
            
            initRecognition(); 
        }

        // 15秒完全無聲防卡死機制
        function resetRestartTimer() {
            clearTimeout(restartTimer);
            if (isRecording) {
                restartTimer = setTimeout(() => {
                    console.warn('長時間未偵測到聲音，執行強制重啟...');
                    if (recognition) {
                        try { recognition.stop(); } catch(e) {}
                    }
                }, 15000); 
            }
        }

        // ==========================================
        // 核心更新：使用 Google Translate API (粵語專屬模型)
        // ==========================================
        async function translateToEnglish(text) {
            try {
                // sl=yue 代表來源語言為廣東話 (Cantonese)，tl=en 代表目標語言為英文
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=yue&tl=en&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                // Google 返回的資料是巢狀陣列，將所有分段的翻譯結果組合起來
                let translatedText = '';
                if (data && data[0]) {
                    for (let i = 0; i < data[0].length; i++) {
                        translatedText += data[0][i][0];
                    }
                }
                return translatedText || text;
            } catch (err) {
                console.error('翻譯出錯:', err);
                return text; 
            }
        }

        async function processAndAppendText(originalText) {
            const timeStamp = new Date().toLocaleTimeString();
            liveTextEl.textContent = '翻譯中...';
            
            const translatedText = await translateToEnglish(originalText);
            
            liveTextEl.textContent = `[最新翻譯]: ${translatedText}`;

            const logEntry = {
                time: timeStamp,
                original: originalText,
                english: translatedText
            };
            fullTranscript.push(logEntry);

            const itemDiv = document.createElement('div');
            itemDiv.className = 'log-item';
            itemDiv.innerHTML = `<span class="time">[${timeStamp}]</span> <strong>原文:</strong> ${originalText}<br><span class="time" style="visibility:hidden">[${timeStamp}]</span> <strong>英文:</strong> ${translatedText}`;
            logContentEl.appendChild(itemDiv);
            
            logContentEl.scrollTop = logContentEl.scrollHeight;
        }

        function stopRecording() {
            isRecording = false;
            clearTimeout(restartTimer);
            clearTimeout(forceSegmentTimer); // 停止錄音時清除 8 秒計時器
            if (recognition) recognition.stop();
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (fullTranscript.length > 0) {
                saveBtn.disabled = false;
            }
        }

        startBtn.addEventListener('click', () => {
            if (!recognition) return;
            isRecording = true;
            fullTranscript = [];
            logContentEl.innerHTML = '';
            liveTextEl.textContent = '聆聽中...';
            
            clearTimeout(forceSegmentTimer);
            forceSegmentTimer = null;

            try {
                recognition.start();
            } catch (e) {
                initRecognition();
                recognition.start();
            }
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
        });

        stopBtn.addEventListener('click', stopRecording);

        saveBtn.addEventListener('click', () => {
            if (fullTranscript.length === 0) return;

            let fileContent = "=== 粵英混合語音即時翻譯紀錄 ===\n\n";
            fullTranscript.forEach(item => {
                fileContent += `[${item.time}]\n`;
                fileContent += `原文: ${item.original}\n`;
                fileContent += `英文: ${item.english}\n\n`;
            });

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `語音翻譯紀錄_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });
    </script>
</body>
</html>
