<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粵英混合語音即時翻譯器 (發射端)</title>
    <!-- 載入 PeerJS P2P 雲端中繼庫 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f4f7f6; color: #333; position: relative; }
        .back-link { position: absolute; top: 10px; left: 10px; text-decoration: none; color: #34495e; font-weight: bold; background: #e0e6ed; padding: 6px 12px; border-radius: 4px; transition: 0.2s; }
        .back-link:hover { background: #d0d7de; }
        h1 { text-align: center; color: #2c3e50; margin-top: 40px; }
        
        .config-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-left: 5px solid #bdc3c7; transition: border-color 0.3s; }
        .config-box.active { border-left-color: #2ecc71; }
        .mode-options { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .mode-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input[type="email"] { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; flex-grow: 1; max-width: 300px; }
        .btn-confirm { padding: 8px 16px; font-size: 14px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-confirm:hover { background-color: #2980b9; }

        .status-banner { margin-top: 15px; padding: 10px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 4px; font-weight: bold; color: #d35400; text-align: center; }
        .status-banner.ready { background: #e8f8f5; border-color: #a3e4d7; color: #16a085; }
        .usage-badge { margin-top: 10px; font-size: 0.9em; color: #7f8c8d; text-align: right; }

        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button.action-btn { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:hover { background-color: #c0392b; }
        #saveBtn { background-color: #3498db; color: white; }
        #saveBtn:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7 !important; cursor: not-allowed; opacity: 0.7; }
        
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; height: 20px; }
        .recording { color: #e74c3c; }

        .live-status-card { background: #eef6fc; border: 2px dashed #3498db; padding: 12px 18px; border-radius: 8px; margin-bottom: 15px; font-size: 15px; }
        .live-title { font-weight: bold; color: #2980b9; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .live-dot { height: 10px; width: 10px; background-color: #e74c3c; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .history-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 320px; overflow-y: auto; }
        .history-box h3 { margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }
        .log-item { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #eee; font-size: 15px; }
        .time { font-size: 0.8em; color: #7f8c8d; margin-right: 8px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← 重整頁面</a>

    <h1>🎙️ 粵英混合語音即時翻譯機 (發射端)</h1>
    
    <div class="config-box" id="configBox">
        <strong>⚙️ 步驟 1：請先確定 API 模式後方可開始錄音</strong>
        
        <div class="mode-options">
            <div class="mode-row">
                <label>
                    <input type="radio" name="apiMode" value="default" id="radioDefault"> 使用預設/匿名模式
                </label>
                <button type="button" class="btn-confirm" id="confirmDefaultBtn">確定使用預設模式</button>
            </div>
            <div class="mode-row">
                <label>
                    <input type="radio" name="apiMode" value="email" id="radioEmail"> 使用個人電郵：
                </label>
                <input type="email" id="userEmail" placeholder="請輸入 Email">
                <button type="button" class="btn-confirm" id="confirmEmailBtn">確定電郵</button>
            </div>
        </div>

        <div id="statusBanner" class="status-banner">
            ⚠️ 尚未選擇模式，請先確定模式以啟用翻譯。
        </div>

        <div class="usage-badge">
            🍪 Cookie 歷史累積翻譯字數：<span id="charCount">0</span> 個字元 | 📡 廣播狀態：<span id="p2pStatus" style="color:#e67e22;font-weight:bold;">建立訊號中...</span>
        </div>
    </div>

    <div class="controls">
        <button id="startBtn" class="action-btn" disabled>開始錄音翻譯</button>
        <button id="stopBtn" class="action-btn" disabled>停止並生成紀錄</button>
        <button id="saveBtn" class="action-btn" disabled>下載文字紀錄 (.txt)</button>
    </div>

    <div id="status" class="status">等待啟用...</div>

    <div class="live-status-card">
        <div class="live-title"><span class="live-dot"></span> 正在即時收音與翻譯：</div>
        <div id="liveText" style="color: #555; font-style: italic;">請先確定 API 模式...</div>
    </div>

    <div class="history-box" id="historyContainer">
        <h3>📜 完整逐字紀錄 (Full Transcript Log)</h3>
        <div id="logContent"></div>
    </div>

    <script>
        // P2P 廣播金鑰頻道 ID (必須與 viewer.html 一致)
        const BROADCAST_ID = "my-company-live-room-channel-2026"; 
        let peer = null;
        let connections = [];

        // 初始化 P2P 伺服器連線
        function initPeer() {
            const p2pStatusEl = document.getElementById('p2pStatus');
            peer = new Peer(BROADCAST_ID);

            peer.on('open', (id) => {
                p2pStatusEl.textContent = '🟢 廣播頻道就緒 (線上 0 人)';
                p2pStatusEl.style.color = '#2ecc71';
            });

            peer.on('connection', (conn) => {
                connections.push(conn);
                p2pStatusEl.textContent = `🟢 廣播中 (線上 ${connections.length} 人觀看)`;
                
                conn.on('close', () => {
                    connections = connections.filter(c => c !== conn);
                    p2pStatusEl.textContent = `🟢 廣播中 (線上 ${connections.length} 人觀看)`;
                });
            });

            peer.on('error', (err) => {
                console.error('P2P 連線錯誤:', err);
                p2pStatusEl.textContent = '🔴 廣播頻道建立失敗 (可離線本機翻譯)';
                p2pStatusEl.style.color = '#e74c3c';
            });
        }

        // Cookie 輔助函式
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusEl = document.getElementById('status');
        const liveTextEl = document.getElementById('liveText');
        const logContentEl = document.getElementById('logContent');

        const configBox = document.getElementById('configBox');
        const statusBanner = document.getElementById('statusBanner');
        const userEmailInput = document.getElementById('userEmail');
        const charCountEl = document.getElementById('charCount');

        let recognition;
        let isRecording = false;
        let fullTranscript = [];
        let currentEmail = '';
        let isModeSet = false;

        let totalCharsUsed = parseInt(getCookie('translator_total_chars') || '0', 10);
        charCountEl.textContent = totalCharsUsed;

        document.getElementById('confirmDefaultBtn').addEventListener('click', () => {
            document.getElementById('radioDefault').checked = true;
            currentEmail = '';
            activateMode('目前正在使用：【預設/匿名模式】');
        });

        document.getElementById('confirmEmailBtn').addEventListener('click', () => {
            const email = userEmailInput.value.trim();
            if (!email || !email.includes('@')) {
                alert('請輸入有效的電子郵件地址！');
                return;
            }
            document.getElementById('radioEmail').checked = true;
            currentEmail = email;
            activateMode(`目前正在使用電郵：【${currentEmail}】`);
        });

        function activateMode(message) {
            isModeSet = true;
            statusBanner.textContent = `✅ ${message}`;
            statusBanner.className = 'status-banner ready';
            configBox.classList.add('active');
            
            startBtn.disabled = false;
            statusEl.textContent = '準備就緒';
            liveTextEl.textContent = '等待語音輸入...';
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('您的瀏覽器不支援 Web Speech API，請改用 Google Chrome 或 Edge 瀏覽器開啟。');
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-HK'; 
            recognition.continuous = true; 
            recognition.interimResults = true;

            recognition.onstart = () => {
                statusEl.textContent = '● 正在聆聽中...';
                statusEl.classList.add('recording');
            };

            recognition.onerror = (event) => {
                console.error('語音辨識錯誤：', event.error);
                if (event.error === 'not-allowed') {
                    alert('請允許存取麥克風權限。');
                    isRecording = false;
                }
            };

            recognition.onend = () => {
                if (isRecording) {
                    setTimeout(() => {
                        if (isRecording) {
                            try { recognition.start(); } catch(e) {}
                        }
                    }, 100);
                } else {
                    statusEl.textContent = '已停止錄音';
                    statusEl.classList.remove('recording');
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcriptText = event.results[i][0].transcript.trim();
                    if (event.results[i].isFinal) {
                        if (transcriptText.length >= 2) {
                            processAndAppendText(transcriptText);
                        }
                    } else {
                        interimTranscript += transcriptText;
                    }
                }
                if (interimTranscript) {
                    liveTextEl.textContent = `[聆聽中]: ${interimTranscript}`;
                }
            };
        }

        async function translateToEnglish(text) {
            try {
                let emailParam = currentEmail ? `&de=${encodeURIComponent(currentEmail)}` : '';
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-HK|en${emailParam}`);
                const data = await response.json();
                
                const translated = data.responseData.translatedText;
                
                if (translated.includes('MYMEMORY WARNING') || translated.includes('QUERY LENGTH LIMIT EXCEEDED')) {
                    return `${text} (⚠️ API 翻譯額度上限)`; 
                }
                
                totalCharsUsed += text.length;
                charCountEl.textContent = totalCharsUsed;
                setCookie('translator_total_chars', totalCharsUsed, 365);

                return translated || text;
            } catch (err) {
                return `${text} (⚠️ 翻譯失敗)`; 
            }
        }

        async function processAndAppendText(originalText) {
            if (!originalText.trim()) return;

            const timeStamp = new Date().toLocaleTimeString();
            liveTextEl.textContent = `[翻譯中...]: ${originalText}`;
            
            const translatedText = await translateToEnglish(originalText);
            liveTextEl.textContent = `[最新翻譯]: ${translatedText}`;

            const logEntry = { time: timeStamp, original: originalText, english: translatedText };
            fullTranscript.push(logEntry);

            // 1. 本地 DOM 畫面渲染
            const itemDiv = document.createElement('div');
            itemDiv.className = 'log-item';
            itemDiv.innerHTML = `<span class="time">[${timeStamp}]</span> <strong>原文:</strong> ${originalText}<br>
                                 <span class="time" style="visibility:hidden">[${timeStamp}]</span> <strong style="color:#2980b9;">英文:</strong> ${translatedText}`;
            logContentEl.appendChild(itemDiv);
            
            requestAnimationFrame(() => {
                itemDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
            });

            // 2. 透過 PeerJS 實時發送給網際網路上所有線上觀眾 (viewer.html)
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(logEntry);
                }
            });
        }

        startBtn.addEventListener('click', () => {
            if (!recognition || !isModeSet) return;
            isRecording = true;
            fullTranscript = [];
            logContentEl.innerHTML = '';
            liveTextEl.textContent = '等待語音...';
            
            try { recognition.start(); } catch (e) {}
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            try { recognition.stop(); } catch(e) {}
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (fullTranscript.length > 0) {
                saveBtn.disabled = false;
            }
        });

        saveBtn.addEventListener('click', () => {
            if (fullTranscript.length === 0) return;
            let fileContent = "=== 粵英混合語音即時翻譯紀錄 ===\n\n";
            fileContent += `目前模式: ${currentEmail ? '電郵模式 (' + currentEmail + ')' : '預設/匿名模式'}\n`;
            fileContent += `Cookie 累積字數: ${totalCharsUsed}\n\n`;
            fileContent += "-----------------------------------\n\n";
            
            fullTranscript.forEach(item => {
                fileContent += `[${item.time}]\n原文: ${item.original}\n英文: ${item.english}\n\n`;
            });
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `語音翻譯紀錄_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });

        // 頁面載入時自動初始化廣播連線
        window.onload = initPeer;
    </script>
</body>
</html>
