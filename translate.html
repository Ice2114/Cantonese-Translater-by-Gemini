<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時翻譯控制台 // Cantonese-Translator Enterprise</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #f1f5f9;
            --success-color: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 920px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        }

        /* 頂部列 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: var(--accent-bg);
            transition: all 0.2s;
        }

        .nav-back:hover {
            color: var(--text-dark);
            background: #e2e8f0;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--accent-bg);
            border: 1px solid var(--border-color);
        }

        .status-badge.recording {
            color: var(--danger);
            background: #fef2f2;
            border-color: #fecaca;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-badge.recording .status-dot {
            background-color: var(--danger);
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            text-align: center;
        }

        /* 控制按鈕組 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #startBtn {
            background-color: var(--primary);
            color: white;
        }
        #startBtn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        #stopBtn {
            background-color: white;
            color: var(--danger);
            border-color: #fca5a5;
        }
        #stopBtn:hover:not(:disabled) {
            background-color: #fef2f2;
        }

        #saveBtn {
            background-color: white;
            color: var(--text-dark);
            border-color: var(--border-color);
        }
        #saveBtn:hover:not(:disabled) {
            background-color: var(--accent-bg);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 內容顯示卡片 */
        .box-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px 20px;
        }

        .box-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #liveText {
            font-size: 1rem;
            min-height: 24px;
            color: var(--text-dark);
            font-weight: 500;
        }

        /* 逐字紀錄面板 */
        #logContent {
            height: 340px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
        }

        /* 自訂滾動條 */
        #logContent::-webkit-scrollbar {
            width: 6px;
        }
        #logContent::-webkit-scrollbar-track {
            background: var(--bg-main);
            border-radius: 4px;
        }
        #logContent::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #logContent::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 會議條目卡片 */
        .log-item {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            animation: fadeIn 0.25s ease-out;
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .log-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
        }

        .log-row:last-child {
            margin-bottom: 0;
        }

        .lang-tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 64px;
            text-align: center;
            margin-top: 2px;
        }

        .lang-tag.zh {
            background: #e0f2fe;
            color: #0369a1;
        }

        .lang-tag.en {
            background: #dcfce7;
            color: #15803d;
        }

        .log-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text-dark);
            word-break: break-word;
        }

        .log-text.en-text {
            font-weight: 600;
            color: #0f172a;
        }

        .empty-log {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 40px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .dashboard-container { padding: 20px; }
            h1 { font-size: 1.3rem; }
            #logContent { height: 280px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 頂部導航 -->
        <div class="header-bar">
            <a href="index.html" class="nav-back">← 返回首頁 Home</a>
            <div id="status" class="status-badge">
                <span class="status-dot"></span>
                <span>系統就緒 Ready</span>
            </div>
        </div>

        <h1>廣東話即時會議翻譯控制台</h1>

        <!-- 按鈕控制組 -->
        <div class="controls">
            <button id="startBtn">▶ 開始錄音 Start</button>
            <button id="stopBtn" disabled>⏹ 停止錄音 Stop</button>
            <button id="saveBtn" disabled>⬇ 下載紀錄 (.txt)</button>
        </div>

        <div class="box-container">
            <!-- 即時語音狀態 -->
            <div class="box">
                <div class="box-header">
                    <span>即時語音監聽 (Live Audio Stream)</span>
                </div>
                <div id="liveText">等待語音輸入...</div>
            </div>

            <!-- 完整歷史對話面板 -->
            <div class="box">
                <div class="box-header">
                    <span>逐字會議紀錄 (Transcript Log)</span>
                </div>
                <div id="logContent">
                    <div class="empty-log">-- 暫無會議對話紀錄 --</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusEl = document.getElementById('status');
        const liveTextEl = document.getElementById('liveText');
        const logContentEl = document.getElementById('logContent');

        let recognition;
        let isRecording = false;
        let fullTranscript = [];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('您的瀏覽器不支援 Web Speech API，請改用 Google Chrome 瀏覽器開啟。');
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-HK'; 
            
            // 單句防卡死重置機制
            recognition.continuous = false; 
            recognition.interimResults = true;

            recognition.onstart = () => {
                statusEl.className = 'status-badge recording';
                statusEl.innerHTML = '<span class="status-dot"></span> 正在聆聽中... Listening';
            };

            recognition.onerror = (event) => {
                console.error('語音辨識錯誤：', event.error);
                if (event.error === 'not-allowed') {
                    alert('請允許存取麥克風權限。');
                    isRecording = false;
                }
            };

            recognition.onend = () => {
                if (isRecording) {
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition.start();
                            } catch(e) {
                                console.log('語音引擎自動重啟...', e);
                            }
                        }
                    }, 100); 
                } else {
                    statusEl.className = 'status-badge';
                    statusEl.innerHTML = '<span class="status-dot"></span> 系統已停止 Stopped';
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcriptText = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        processAndAppendText(transcriptText);
                        try {
                            recognition.stop();
                        } catch(e) {}
                    } else {
                        interimTranscript += transcriptText;
                    }
                }
                if (interimTranscript) {
                    liveTextEl.textContent = `[聆聽中]: ${interimTranscript}`;
                }
            };
        }

        async function translateToEnglish(text) {
            try {
                const email = 'your_email@example.com'; 
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-HK|en&de=${email}`);
                const data = await response.json();
                
                const translated = data.responseData.translatedText;
                
                if (translated.includes('MYMEMORY WARNING') || translated.includes('QUERY LENGTH LIMIT EXCEEDED')) {
                    return `${text} (⚠️ API 翻譯額度已達上限)`; 
                }
                
                return translated || text;
            } catch (err) {
                return `${text} (⚠️ 翻譯網絡異常)`; 
            }
        }

        async function processAndAppendText(originalText) {
            if (!originalText.trim()) return;

            const timeStamp = new Date().toLocaleTimeString();
            liveTextEl.textContent = `[翻譯中...]: ${originalText}`;
            
            const translatedText = await translateToEnglish(originalText);
            liveTextEl.textContent = translatedText;

            const logEntry = { time: timeStamp, original: originalText, english: translatedText };
            fullTranscript.push(logEntry);

            // 第一條紀錄出現時，先清空預設提示
            if (fullTranscript.length === 1) {
                logContentEl.innerHTML = '';
            }

            // 判斷使用者是否正在向上滾動閱讀舊紀錄
            const isNearBottom = logContentEl.scrollHeight - logContentEl.scrollTop - logContentEl.clientHeight < 120;

            // 渲染商務卡片條目
            const itemDiv = document.createElement('div');
            itemDiv.className = 'log-item';
            itemDiv.innerHTML = `
                <div class="log-meta">
                    <span>ITEM #${fullTranscript.length.toString().padStart(2, '0')}</span>
                    <span>${timeStamp}</span>
                </div>
                <div class="log-row">
                    <span class="lang-tag zh">粵語原文</span>
                    <span class="log-text">${originalText}</span>
                </div>
                <div class="log-row">
                    <span class="lang-tag en">英文翻譯</span>
                    <span class="log-text en-text">${translatedText}</span>
                </div>
            `;
            logContentEl.appendChild(itemDiv);
            
            // 智慧自動平滑滾動
            if (isNearBottom || fullTranscript.length <= 3) {
                logContentEl.scrollTo({
                    top: logContentEl.scrollHeight,
                    behavior: 'smooth'
                });
            }
        }

        startBtn.addEventListener('click', () => {
            if (!recognition) return;
            isRecording = true;
            fullTranscript = [];
            logContentEl.innerHTML = '<div class="empty-log">-- 正在聆聽，請開始發言... --</div>';
            liveTextEl.textContent = '等待語音輸入...';
            
            try {
                recognition.start();
            } catch (e) {}
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            try {
                recognition.stop();
            } catch(e) {}
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (fullTranscript.length > 0) {
                saveBtn.disabled = false;
            }
        });

        saveBtn.addEventListener('click', () => {
            if (fullTranscript.length === 0) return;
            let fileContent = "=== 廣東話即時會議翻譯紀錄 (Cantonese-Translator Log) ===\n\n";
            fullTranscript.forEach((item, index) => {
                fileContent += `[${item.time}] ITEM #${index + 1}\n`;
                fileContent += `粵語原文: ${item.original}\n`;
                fileContent += `英文翻譯: ${item.english}\n\n`;
            });
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `廣東話會議翻譯紀錄_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });
    </script>
</body>
</html>
