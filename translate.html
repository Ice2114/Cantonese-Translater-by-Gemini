<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粵英混合語音即時翻譯器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        #startBtn { background-color: #2ecc71; color: white; }
        #startBtn:hover { background-color: #27ae60; }
        #stopBtn { background-color: #e74c3c; color: white; }
        #stopBtn:hover { background-color: #c0392b; }
        #saveBtn { background-color: #3498db; color: white; }
        #saveBtn:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; height: 20px; }
        .recording { color: #e74c3c; }
        .box-container { display: flex; flex-direction: column; gap: 15px; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-height: 120px; max-height: 250px; overflow-y: auto; }
        .box h3 { margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
        .log-item { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px dashed #eee; }
        .time { font-size: 0.8em; color: #7f8c8d; margin-right: 8px; }
    </style>
</head>
<body>

    <h1>粵英混合語音即時翻譯紀錄器</h1>
    
    <div class="controls">
        <button id="startBtn">開始錄音翻譯</button>
        <button id="stopBtn" disabled>停止並生成紀錄</button>
        <button id="saveBtn" disabled>下載文字紀錄 (.txt)</button>
    </div>

    <div id="status" class="status">準備就緒</div>

    <div class="box-container">
        <div class="box">
            <h3>即時辨識與翻譯 (Live Translation)</h3>
            <div id="liveText" style="color: #7f8c8d; font-style: italic;">等待語音輸入...</div>
        </div>

        <div class="box">
            <h3>完整逐字紀錄 (Full Transcript Log)</h3>
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusEl = document.getElementById('status');
        const liveTextEl = document.getElementById('liveText');
        const logContentEl = document.getElementById('logContent');

        let recognition;
        let isRecording = false;
        let fullTranscript = [];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('您的瀏覽器不支援 Web Speech API，請改用 Google Chrome 瀏覽器開啟。');
        } else {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-HK'; 
            
            // 【核心修復 1】：改為單句模式，防止內存卡死
            recognition.continuous = false; 
            recognition.interimResults = true;

            recognition.onstart = () => {
                statusEl.textContent = '● 正在聆聽中...';
                statusEl.classList.add('recording');
            };

            recognition.onerror = (event) => {
                console.error('語音辨識錯誤：', event.error);
                if (event.error === 'not-allowed') {
                    alert('請允許存取麥克風權限。');
                    isRecording = false;
                }
            };

            recognition.onend = () => {
                // 【核心修復 2】：單句結束（或超時）後自動完成乾淨重置，並重新啟動
                if (isRecording) {
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition.start();
                            } catch(e) {
                                console.log('引擎重啟中...', e);
                            }
                        }
                    }, 100); // 100ms 緩衝足以清空 Chrome 內部語音 Buffer
                } else {
                    statusEl.textContent = '已停止錄音';
                    statusEl.classList.remove('recording');
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcriptText = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        // 處理當前句子
                        processAndAppendText(transcriptText);
                        
                        // 【核心修復 3】：確定是一句完整發言後，主動切斷 trigger onend 重置
                        try {
                            recognition.stop();
                        } catch(e) {}
                    } else {
                        interimTranscript += transcriptText;
                    }
                }
                if (interimTranscript) {
                    liveTextEl.textContent = `[聆聽中]: ${interimTranscript}`;
                }
            };
        }

        async function translateToEnglish(text) {
            try {
                const email = 'your_email@example.com'; 
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-HK|en&de=${email}`);
                const data = await response.json();
                
                const translated = data.responseData.translatedText;
                
                if (translated.includes('MYMEMORY WARNING') || translated.includes('QUERY LENGTH LIMIT EXCEEDED')) {
                    return `${text} (⚠️ API 翻譯額度上限)`; 
                }
                
                return translated || text;
            } catch (err) {
                return `${text} (⚠️ 翻譯失敗)`; 
            }
        }

        async function processAndAppendText(originalText) {
            if (!originalText.trim()) return;

            const timeStamp = new Date().toLocaleTimeString();
            liveTextEl.textContent = `[處理中]: ${originalText}`;
            
            const translatedText = await translateToEnglish(originalText);
            liveTextEl.textContent = `[最新翻譯]: ${translatedText}`;

            const logEntry = { time: timeStamp, original: originalText, english: translatedText };
            fullTranscript.push(logEntry);

            const itemDiv = document.createElement('div');
            itemDiv.className = 'log-item';
            itemDiv.innerHTML = `<span class="time">[${timeStamp}]</span> <strong>原文:</strong> ${originalText}<br>
                                 <span class="time" style="visibility:hidden">[${timeStamp}]</span> <strong style="color:#2980b9;">英文:</strong> ${translatedText}`;
            logContentEl.appendChild(itemDiv);
            
            logContentEl.scrollTop = logContentEl.scrollHeight;
        }

        startBtn.addEventListener('click', () => {
            if (!recognition) return;
            isRecording = true;
            fullTranscript = [];
            logContentEl.innerHTML = '';
            liveTextEl.textContent = '等待語音...';
            
            try {
                recognition.start();
            } catch (e) {}
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;
        });

        stopBtn.addEventListener('click', () => {
            isRecording = false;
            try {
                recognition.stop();
            } catch(e) {}
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (fullTranscript.length > 0) {
                saveBtn.disabled = false;
            }
        });

        saveBtn.addEventListener('click', () => {
            if (fullTranscript.length === 0) return;
            let fileContent = "=== 粵英混合語音即時翻譯紀錄 ===\n\n";
            fullTranscript.forEach(item => {
                fileContent += `[${item.time}]\n原文: ${item.original}\n英文: ${item.english}\n\n`;
            });
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `語音翻譯紀錄_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });
    </script>
</body>
</html>
